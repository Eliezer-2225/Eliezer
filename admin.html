<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 24px;
      color: #38bdf8;
    }

    .badge {
      background: #0284c7;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .stats {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 25px;
      width: 220px;
    }

    .stats h3 {
      font-size: 14px;
      color: #94a3b8;
    }

    .stats p {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .table-box {
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #334155;
    }

    th {
      background: #0f172a;
      color: #94a3b8;
    }

    .btn-delete {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>👑 Super Admin Dashboard</h1>
      <span class="badge">Live Connection</span>
    </header>

    <div class="stats">
      <h3>Total Submissions</h3>
      <p id="totalCount">0</p>
    </div>

    <div class="table-box">
      <h2 style="margin-bottom: 15px; color: #38bdf8; font-size: 18px;">Incoming User Messages</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Message</th>
            <th>Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="messageList">
          <!-- Live messages will appear here -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://eliezer-6f8aa-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const messageList = document.getElementById('messageList');
    const totalCount = document.getElementById('totalCount');

    const messagesRef = ref(database, 'messages');

    onValue(messagesRef, (snapshot) => {
      messageList.innerHTML = '';
      const data = snapshot.val();
      
      if (data) {
        const keys = Object.keys(data);
        totalCount.textContent = keys.length;

        keys.forEach((key, index) => {
          const item = data[key];
          const row = `
            <tr>
              <td>${index + 1}</td>
              <td><strong>${item.name}</strong></td>
              <td>${item.message}</td>
              <td>${item.timestamp}</td>
              <td><button class="btn-delete" onclick="deleteMessage('${key}')">Delete</button></td>
            </tr>
          `;
          messageList.innerHTML += row;
        });
      } else {
        totalCount.textContent = '0';
        messageList.innerHTML = '<tr><td colspan="5" style="text-align:center;">No messages found.</td></tr>';
      }
    });

    window.deleteMessage = function(key) {
      remove(ref(database, 'messages/' + key));
    };
  </script>
</body>
</html>
