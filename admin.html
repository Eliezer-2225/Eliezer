<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Control Center - Security Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px 20px;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
    }

    .admin-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .btn-clear {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-clear:hover { background: #dc2626; }

    .stats-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #334155;
      margin-bottom: 25px;
      display: flex;
      gap: 30px;
    }

    .stat-box h4 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
    .stat-box p { font-size: 1.8rem; font-weight: 800; color: #f8fafc; margin-top: 5px; }

    .table-card {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #0f172a;
      padding: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #334155;
      font-size: 0.95rem;
    }

    tr:last-child td { border-bottom: none; }

    .badge-error {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-bar">
      <h1 class="admin-title">🛡️ Admin Access Logs</h1>
      <button class="btn-clear" onclick="clearLogs()">Clear All Logs</button>
    </div>

    <div class="stats-card">
      <div class="stat-box">
        <h4>Total Unauthorized Attempts</h4>
        <p id="total-attempts">0</p>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Attempted Username</th>
            <th>Attempted Password</th>
            <th>Error Reason</th>
          </tr>
        </thead>
        <tbody id="logs-table-body">
          <!-- Logs populate here -->
        </tbody>
      </table>
      <div id="empty-msg" class="empty-state" style="display: none;">
        ምንም የተሳሳተ የመግባት ሙከራ እስካሁን አልተመዘገበም።
      </div>
    </div>
  </div>

  <script>
    function loadLogs() {
      const logs = JSON.parse(localStorage.getItem('unauthorized_attempts') || '[]');
      const tbody = document.getElementById('logs-table-body');
      const emptyMsg = document.getElementById('empty-msg');
      document.getElementById('total-attempts').innerText = logs.length;

      tbody.innerHTML = '';

      if (logs.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      logs.forEach(log => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${log.timestamp}</td>
          <td style="font-weight: 700; color: #38bdf8;">${log.username}</td>
          <td style="font-family: monospace; color: #f43f5e;">${log.password}</td>
          <td><span class="badge-error">${log.reason}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function clearLogs() {
      if (confirm("እርግጠኛ ነህ ሁሉንም ሎጎች ማጽዳት ትፈልጋለህ?")) {
        localStorage.removeItem('unauthorized_attempts');
        loadLogs();
      }
    }

    loadLogs();
  </script>

</body>
</html>
