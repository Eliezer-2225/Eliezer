<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Sent Feelings</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background: #0d1117;
      color: #e0f2fe;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-container {
      width: 100%;
      max-width: 600px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #30363d;
    }

    .admin-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clear-btn {
      padding: 8px 16px;
      background: #f85149;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .clear-btn:hover {
      opacity: 0.85;
    }

    .feelings-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .feeling-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .sender-name {
      font-size: 1rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .send-time {
      font-size: 0.75rem;
      color: #8b949e;
    }

    .card-body {
      background: #0d1117;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #21262d;
      color: #f0f6fc;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .no-data {
      text-align: center;
      color: #8b949e;
      font-size: 1rem;
      margin-top: 40px;
      padding: 30px;
      background: #161b22;
      border-radius: 14px;
      border: 1px dashed #30363d;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">
        <span>💌 Admin Received Messages</span>
      </div>
      <button class="clear-btn" onclick="clearAllData()">Clear All</button>
    </div>

    <div class="feelings-list" id="feelings-list">
      <!-- Sent feelings will render here dynamically -->
    </div>
  </div>

  <script>
    const feelingsListContainer = document.getElementById('feelings-list');

    function loadFeelingsData() {
      feelingsListContainer.innerHTML = '';
      
      const storedData = JSON.parse(localStorage.getItem('adminSentFeelings') || '[]');

      if (storedData.length === 0) {
        feelingsListContainer.innerHTML = `
          <div class="no-data">
            No feelings or messages received yet! 📩
          </div>
        `;
        return;
      }

      // Render messages (Newest first)
      storedData.reverse().forEach((item) => {
        const card = document.createElement('div');
        card.className = 'feeling-card';

        card.innerHTML = `
          <div class="card-header">
            <span class="sender-name">👤 ${escapeHtml(item.senderName || 'Anonymous')}</span>
            <span class="send-time">🕒 ${escapeHtml(item.time || '')}</span>
          </div>
          <div class="card-body">${escapeHtml(item.feelingText || '')}</div>
        `;

        feelingsListContainer.appendChild(card);
      });
    }

    function clearAllData() {
      if (confirm('Are you sure you want to clear all received messages?')) {
        localStorage.removeItem('adminSentFeelings');
        loadFeelingsData();
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Load messages on startup
    loadFeelingsData();
  </script>

</body>
</html>
