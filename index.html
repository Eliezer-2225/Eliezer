<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Bestie ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
      position: relative;
    }

    h1 {
      color: #d63384;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .gif-box img {
      width: 150px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-yes {
      background: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }

    .btn-no {
      background: #dc3545;
      color: white;
      position: absolute;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
    }

    /* Form step hidden initially */
    .form-step {
      display: none;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ff9a9e;
      border-radius: 10px;
      margin-top: 15px;
      outline: none;
      font-size: 15px;
    }

    .btn-submit {
      background: #d63384;
      color: white;
      margin-top: 15px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    
    <!-- Step 1: Fun Prank Question -->
    <div id="step1">
      <div class="gif-box">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHNxeGsyOHk4dzhicWRmZTRybWlqbnRwNXFqMXRseGNrZ3ByOCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lq0h93752f6J9tijrh/giphy.gif" alt="cute anime">
      </div>
      <h1>Do you love having me as your bestie? 😜</h1>
      
      <div class="btn-group">
        <button class="btn-yes" onclick="nextStep()">Of course! ❤️</button>
        <button class="btn-no" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No ❌</button>
      </div>
    </div>

    <!-- Step 2: Food Question -->
    <div id="step2" class="form-step">
      <div class="gif-box">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnZxaWk1YjRwNDFldWRiaWkzcWV2bWlyNDR6OWp6OWszdndsbTZtYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cM2CN5U9yBsxXooDhc/giphy.gif" alt="happy dance">
      </div>
      <h1>Yay! I knew it! 😂</h1>
      <p style="color: #666; font-size: 14px;">Now tell me, what is your favorite food?</p>
      
      <input type="text" id="foodInput" placeholder="Ex: Burger, Pizza, Doro Wot...">
      <button class="btn-submit" onclick="submitData()">Send to Me 🚀</button>
    </div>

    <!-- Step 3: Thank You -->
    <div id="step3" class="form-step">
      <div class="gif-box">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmNwbTNxeGhkcnBsc254enBybzJtMHNtbGJwNngyaW0wNmhxeWdpdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/G96zgIcQn732xTC91s/giphy.gif" alt="love heart">
      </div>
      <h1>Thank You So Much! ❤️</h1>
      <p style="color: #555;">Your answer has been sent to my Super Admin page!</p>
    </div>

  </div>

  <script>
    // "No" Button escape logic
    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const card = document.getElementById('mainCard');
      
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Calculate random position inside the card limits
      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;

      const randomX = Math.floor(Math.random() * maxX) - (cardRect.width / 2) + 50;
      const randomY = Math.floor(Math.random() * maxY) - (cardRect.height / 2) + 50;

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Go to next question
    function nextStep() {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    // Final submit action
    function submitData() {
      const food = document.getElementById('foodInput').value;
      if(food.trim() === "") {
        alert("Please fill in the information!");
        return;
      }
      
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';

      console.log("Bestie's food choice:", food);
    }
  </script>
</body>
</html>
