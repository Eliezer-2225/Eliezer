<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Page - Interactive Experience</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@700&family=Great+Vibes&family=Monoton&family=Pacifico&family=Playfair+Display:ital,wght@1,800&family=Poppins:wght@400;600;800&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000000;
      font-family: 'Cinzel Decorative', cursive;
      overflow: hidden;
      position: relative;
    }

    /* 0. SECURITY GATE CARD */
    #security-gate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.6s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .login-card-gate {
      width: 90%;
      max-width: 380px;
      padding: 30px 25px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    .gate-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .field-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .field-group label {
      font-size: 0.85rem;
      color: #8b949e;
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .gate-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: border-color 0.2s;
    }

    .gate-input:focus {
      border-color: #38bdf8;
    }

    .gate-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .gate-error {
      color: #f85149;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* 1. Main Card Layout */
    .welcome-card {
      position: relative;
      background: linear-gradient(145deg, #0a192f, #020c1b);
      padding: 40px 20px;
      border-radius: 28px;
      border: 1px solid rgba(0, 180, 216, 0.4);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0, 180, 216, 0.3);
      text-align: center;
      max-width: 90%;
      width: 480px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .welcome-card.no-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .welcome-main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: all 1.2s ease;
    }

    .welcome-char {
      display: inline-block;
      font-size: 3.2rem;
      font-weight: 900;
      color: #90e0ef;
      text-transform: uppercase;
      text-shadow: 0 0 15px #00b4d8, 0 0 35px #0077b6;
      letter-spacing: 2px;
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .welcome-sub {
      font-size: 1.8rem;
      font-weight: 700;
      color: #48cae4;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
      transition: opacity 1s ease;
    }

    .emoji-img {
      width: 75px;
      height: 75px;
      margin: 15px 0;
      filter: drop-shadow(0 0 12px rgba(255, 204, 0, 0.6));
      transition: opacity 1s ease;
    }

    /* 2. Floating Text */
    #eyael-container {
      position: absolute;
      z-index: 20;
      white-space: nowrap;
      transition: opacity 0.5s ease;
    }

    .eyael-text {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      font-weight: 700;
      color: #ffcc00;
      text-shadow: 0 0 12px rgba(255, 204, 0, 0.9);
      transition: font-family 0.3s, color 0.3s, transform 0.1s linear;
      display: inline-block;
    }

    /* 3. Blue Heart Emoji */
    #heart-container {
      position: absolute;
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .blue-heart-img {
      width: 42px;
      height: 42px;
      filter: drop-shadow(0 0 15px rgba(0, 119, 182, 0.9));
      transition: transform 0.1s linear;
    }

    /* 4. Universe Background */
    #universe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      transition: opacity 1s ease;
    }

    .star-eyael {
      position: absolute;
      white-space: nowrap;
      opacity: 0;
      animation: universeFade 3s ease-in-out infinite;
    }

    @keyframes universeFade {
      0% { opacity: 0; transform: translateY(10px) scale(0.6); }
      50% { opacity: 0.9; transform: translateY(-15px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.7); }
    }

    /* 5. CLICK ME BUTTON CARD */
    #click-me-card {
      position: absolute;
      bottom: -150px;
      opacity: 0;
      z-index: 30;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      padding: 8px 22px;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(0, 180, 216, 0.6);
      border: 1px solid #90e0ef;
      cursor: pointer;
      transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #click-me-card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(144, 224, 239, 0.9);
    }

    .click-me-text {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sun-glow {
      color: #fff7ad !important;
      text-shadow: 0 0 20px #ffae00, 0 0 40px #ff7700, 0 0 80px #ff0000 !important;
      font-family: 'Playfair Display', serif !important;
    }

    /* 6. COW PAGE MODAL CONTAINER */
    #cow-page-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #0284c7 0%, #0369a1 40%, #0c4a6e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
      overflow-y: auto;
      padding: 20px;
    }

    #cow-page-modal.active {
      opacity: 1;
      pointer-events: all;
    }

    /* WAVE COLOR ANIMATION ACROSS SCREEN */
    #cow-page-modal.animated-bg {
      background: linear-gradient(-45deg, #ff0055, #7a00ff, #00d4ff, #00ff88, #ffb700, #ff0055) !important;
      background-size: 400% 400% !important;
      animation: waveColorGradient 8s ease infinite !important;
    }

    @keyframes waveColorGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .cow-title-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      transition: opacity 0.5s ease;
    }

    .cow-title {
      font-family: 'Poppins', sans-serif;
      color: #e0f2fe;
      font-size: 1.8rem;
      font-weight: 800;
      text-shadow: 0 0 15px #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .orig-hug-emoji {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.8));
    }

    .cow-card-wrapper {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      transition: all 0.5s ease;
    }

    .cow-card-wrapper.no-wrapper {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }

    .blue-cow-gif {
      width: 200px;
      max-width: 70vw;
      border-radius: 16px;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8));
      animation: bounceCow 2.5s infinite ease-in-out;
      margin-bottom: 15px;
      transition: opacity 0.5s ease;
    }

    @keyframes bounceCow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    /* INPUT BOX CONTAINER */
    .feeling-box-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      transition: opacity 0.5s ease;
    }

    .feeling-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e0f2fe;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
    }

    .feeling-textarea {
      width: 100%;
      height: 75px;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 12px;
      padding: 10px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      resize: none;
    }

    .feeling-textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .send-feeling-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.6);
      transition: transform 0.2s ease;
    }

    .send-feeling-btn:hover {
      transform: scale(1.02);
    }

    /* UNIQUE FONT STYLE FOR 'I LOVE YOU SO MUCH' */
    .special-love-font {
      font-family: 'Dancing Script', 'Great Vibes', cursive !important;
      font-size: 3.5rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      text-shadow: 0 0 15px #ff007f, 0 0 30px #ff00a0, 0 0 45px #9d00ff !important;
      line-height: 1.2;
      margin-top: 5px;
    }

    /* SUCCESS RESPONSE BANNER */
    .success-msg-banner {
      display: none;
      width: 100%;
      padding: 15px;
      text-align: center;
      animation: fadeInZoom 0.8s ease forwards;
    }

    .success-first-line {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #e0f2fe;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* CLOSE / CARD BUTTON */
    #close-card-btn {
      display: none;
      margin-top: 20px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #ff007f, #7a00ff);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
      animation: fadeInZoom 0.8s ease forwards;
      transition: all 0.3s ease;
    }

    #close-card-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 0, 127, 1);
    }

    @keyframes fadeInZoom {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .welcome-char { font-size: 2.2rem; }
      .welcome-sub { font-size: 1.3rem; }
      .eyael-text { font-size: 2.7rem; }
      .cow-title { font-size: 1.4rem; }
      .orig-hug-emoji { width: 32px; height: 32px; }
      .special-love-font { font-size: 2.6rem !important; }
    }
  </style>
</head>
<body>

  <!-- LOCAL AUDIO FILE ("ተወራረጃለሁ.m4a") -->
  <audio id="background-mezmur" preload="auto">
    <source src="ተወራረጃለሁ.m4a" type="audio/mp4">
    <source src="ተወራረጃለሁ.m4a" type="audio/aac">
    <source src="ተወራረጃለሁ.m4a" type="audio/mpeg">
  </audio>

  <!-- STEP 0: Security Gate Overlay -->
  <div id="security-gate">
    <div class="login-card-gate">
      <div class="gate-title">🔒 Private Portal</div>
      
      <div class="field-group">
        <label>Your Name</label>
        <input type="text" id="gate-name" class="gate-input" placeholder="Enter name..." autocomplete="off" />
      </div>

      <div class="field-group">
        <label>Password (7 characters)</label>
        <input type="password" id="gate-pass" class="gate-input" placeholder="Enter 7-character code..." />
      </div>

      <button class="gate-btn" onclick="checkGateAccess()">Enter Page</button>
      
      <div class="gate-error" id="gate-error">
        Access Denied! Your password is not correct. Please try again.
      </div>
    </div>
  </div>

  <!-- Main Card -->
  <div class="welcome-card" id="main-card">
    <div class="welcome-main-container" id="welcome-text-box">
      <span class="welcome-char">W</span>
      <span class="welcome-char">E</span>
      <span class="welcome-char">L</span>
      <span class="welcome-char">C</span>
      <span class="welcome-char">O</span>
      <span class="welcome-char">M</span>
      <span class="welcome-char">E</span>
    </div>

    <h2 class="welcome-sub" id="w-sub">TO THIS PAGE</h2>
    
    <img src="https://em-content.zobj.net/source/apple/354/hugging-face_1f917.png" alt="Hugging Emoji" class="emoji-img" id="main-emoji" />
    
    <div id="eyael-base-box" style="height: 60px; width: 100%;"></div>
  </div>

  <!-- Floating Text -->
  <div id="eyael-container">
    <span class="eyael-text" id="eyael-txt"></span>
  </div>

  <!-- Chasing & Giant Heart 💙 -->
  <div id="heart-container">
    <img src="https://em-content.zobj.net/source/apple/354/blue-heart_1f499.png" alt="Blue Heart" class="blue-heart-img" id="heart-img" />
  </div>

  <!-- Universe Background -->
  <div id="universe-container"></div>

  <!-- CLICK ME BUTTON CARD -->
  <div id="click-me-card" onclick="goToNextPage()">
    <span class="click-me-text">Click Me ✨</span>
  </div>

  <!-- COW PAGE MODAL INTERFACE -->
  <div id="cow-page-modal">
    <div class="cow-title-container" id="cow-title-box">
      <div class="cow-title">COME HERE</div>
      <img src="https://em-content.zobj.net/source/apple/354/hugging-face_1f917.png" alt="Hugging Emoji" class="orig-hug-emoji" />
    </div>

    <div class="cow-card-wrapper" id="cow-card">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2J0ZjcxN2dqZjdzcm05aHhhcGU2OHllYmd6ZXAydXVuaGNxNDRuaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif" alt="Cute Animated Cow" class="blue-cow-gif" id="cow-gif" />
      
      <!-- Type Your Feeling Form -->
      <div class="feeling-box-container" id="feeling-form-box">
        <div class="feeling-label">Type your feeling:</div>
        <textarea id="user-feeling" class="feeling-textarea" placeholder="Write what you feel here..."></textarea>
        <button class="send-feeling-btn" onclick="sendFeelingData()">SEND 💌</button>
      </div>

      <!-- Success Banner with Custom Script Font -->
      <div class="success-msg-banner" id="success-banner">
        <div class="success-first-line">sent successfully</div>
        <div class="special-love-font">I LOVE YOU SO MUCH🥰</div>
      </div>
    </div>

    <!-- CLOSE / CARD BUTTON -->
    <button id="close-card-btn" onclick="transformLettersAndReturn()">CLOSE ✨</button>
  </div>

  <!-- LETTER ANIMATION OVERLAY -->
  <div id="letter-anim-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:2500; display:none; justify-content:center; align-items:center;">
    <div id="flying-letters-box" style="position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
  </div>

  <script>
    const securityGate = document.getElementById('security-gate');
    const gateName = document.getElementById('gate-name');
    const gatePass = document.getElementById('gate-pass');
    const gateError = document.getElementById('gate-error');

    const eyaelBox = document.getElementById('eyael-container');
    const eyaelTxt = document.getElementById('eyael-txt');
    const heartBox = document.getElementById('heart-container');
    const heartImg = document.getElementById('heart-img');
    const mainCard = document.getElementById('main-card');
    const wSub = document.getElementById('w-sub');
    const mainEmoji = document.getElementById('main-emoji');
    const universe = document.getElementById('universe-container');
    const welcomeChars = document.querySelectorAll('.welcome-char');
    const clickMeBtn = document.getElementById('click-me-card');
    
    /* COW MODAL ELEMENTS */
    const cowModal = document.getElementById('cow-page-modal');
    const cowCardWrapper = document.getElementById('cow-card');
    const cowTitleBox = document.getElementById('cow-title-box');
    const cowGif = document.getElementById('cow-gif');
    const feelingFormBox = document.getElementById('feeling-form-box');
    const userFeelingInput = document.getElementById('user-feeling');
    const successBanner = document.getElementById('success-banner');
    const closeCardBtn = document.getElementById('close-card-btn');
    const backgroundMezmur = document.getElementById('background-mezmur');

    const letterAnimOverlay = document.getElementById('letter-anim-overlay');
    const flyingLettersBox = document.getElementById('flying-letters-box');

    const fonts = ['Great Vibes', 'Pacifico', 'Monoton', 'Cinzel Decorative', 'Playfair Display', 'Dancing Script'];
    const colors = ['#ffcc00', '#90e0ef', '#ff4d6d', '#70e000', '#e0aaff', '#00f5d4', '#ff9e00', '#ff007f', '#00d4ff'];

    let activeDisplayName = "Eyael";
    let ex = window.innerWidth / 2 - 60;
    let ey = window.innerHeight / 2 + 120;
    let hx = ex + 130;
    let hy = ey;

    let evx = 4, evy = 3;
    let scaleEyael = 1.0;
    let isEyaelRunning = false;
    let isHeartChasing = false;
    let isGiantCovering = false;
    let heartScale = 1.0;

    function checkGateAccess() {
      const name = gateName.value.trim();
      const pass = gatePass.value.trim();

      if (pass.length === 7 && name.length > 0) {
        gateError.style.display = 'none';
        
        activeDisplayName = name;
        eyaelTxt.innerText = activeDisplayName;

        localStorage.setItem('currentUser', name);

        securityGate.style.opacity = '0';
        setTimeout(() => {
          securityGate.style.display = 'none';
          initMainExperience();
        }, 600);

      } else {
        gateError.style.display = 'block';
      }
    }

    function initMainExperience() {
      eyaelBox.style.left = ex + 'px';
      eyaelBox.style.top = ey + 'px';
      heartBox.style.left = hx + 'px';
      heartBox.style.top = hy + 'px';

      setTimeout(() => {
        isEyaelRunning = true;
        requestAnimationFrame(gameLoop);
      }, 4000);

      setTimeout(() => {
        isHeartChasing = true;
        setInterval(spawnUniverseEyael, 180);
      }, 6000);

      setTimeout(() => {
        isGiantCovering = true;
      }, 9000);

      setTimeout(() => {
        isEyaelRunning = false;
        isHeartChasing = false;
        eyaelBox.style.opacity = '0';
        heartBox.style.opacity = '0';
      }, 12000);

      setTimeout(() => {
        universe.style.opacity = '0';
        wSub.style.opacity = '0';
        mainEmoji.style.opacity = '0';
      }, 14000);

      setTimeout(() => {
        wSub.style.display = 'none';
        mainEmoji.style.display = 'none';
        mainCard.classList.add('no-card');

        welcomeChars.forEach((char) => {
          const rx = (Math.random() - 0.5) * 200;
          const ry = (Math.random() - 0.5) * 200;
          const rRot = (Math.random() - 0.5) * 360;
          char.style.transform = `translate(${rx}px, ${ry}px) rotate(${rRot}deg)`;
          char.classList.add('sun-glow');
        });

        setTimeout(() => {
          welcomeChars.forEach((char) => {
            char.style.transform = 'translate(0, 0) rotate(0deg) scale(1.2)';
          });
          
          setTimeout(() => {
            document.getElementById('welcome-text-box').style.transform = 'translateY(-100px)';
            
            setTimeout(() => {
              clickMeBtn.style.bottom = '120px';
              clickMeBtn.style.opacity = '1';
            }, 600);

          }, 1000);

        }, 1200);

      }, 16000);
    }

    function gameLoop() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;

      if (isEyaelRunning) {
        ex += evx;
        ey += evy;

        if (ex + 120 >= sw || ex <= 10) evx = -evx;
        if (ey + 60 >= sh || ey <= 10) evy = -evy;

        scaleEyael = Math.max(0.4, scaleEyael - 0.0008);

        if (Math.random() < 0.05) {
          eyaelTxt.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
          eyaelTxt.style.color = colors[Math.floor(Math.random() * colors.length)];
        }

        eyaelBox.style.left = ex + 'px';
        eyaelBox.style.top = ey + 'px';
        eyaelBox.style.transform = `scale(${scaleEyael})`;
      }

      if (isHeartChasing) {
        if (!isGiantCovering) {
          hx += (ex - hx) * 0.08;
          hy += (ey - hy) * 0.08;
        } else {
          hx += (ex - hx) * 0.2;
          hy += (ey - hy) * 0.2;
          heartScale += 0.25;
        }

        heartBox.style.left = hx + 'px';
        heartBox.style.top = hy + 'px';
        heartImg.style.transform = `scale(${heartScale})`;
      }

      if (isEyaelRunning || isHeartChasing) {
        requestAnimationFrame(gameLoop);
      }
    }

    function spawnUniverseEyael() {
      if (universe.style.opacity === '0') return;
      
      const star = document.createElement('div');
      star.className = 'star-eyael';
      star.innerText = activeDisplayName;

      const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const randomSize = Math.floor(Math.random() * 24) + 16;
      const rx = Math.random() * (window.innerWidth - 80);
      const ry = Math.random() * (window.innerHeight - 50);

      star.style.fontFamily = randomFont;
      star.style.color = randomColor;
      star.style.fontSize = randomSize + 'px';
      star.style.left = rx + 'px';
      star.style.top = ry + 'px';
      star.style.textShadow = `0 0 12px ${randomColor}`;

      universe.appendChild(star);
      setTimeout(() => star.remove(), 3000);
    }

    function goToNextPage() {
      cowModal.classList.add('active');
    }

    /* ACTION UPON CLICKING SEND 💌 */
    function sendFeelingData() {
      const text = userFeelingInput.value.trim();
      if (!text) return;

      // 1. Play Local Audio ("ተወራረጃለሁ.m4a") Directly on User Click
      if (backgroundMezmur) {
        backgroundMezmur.currentTime = 0;
        const playPromise = backgroundMezmur.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.log("Audio playback error:", err);
          });
        }
      }

      // 2. Save data locally
      const existingData = JSON.parse(localStorage.getItem('adminSentFeelings') || '[]');
      const newEntry = {
        senderName: activeDisplayName,
        feelingText: text,
        time: new Date().toLocaleString()
      };
      existingData.push(newEntry);
      localStorage.setItem('adminSentFeelings', JSON.stringify(existingData));

      // 3. Hide Cow GIF, Title, and Input Form
      cowTitleBox.style.display = 'none';
      cowGif.style.display = 'none';
      feelingFormBox.style.display = 'none';

      // 4. Show Beautiful Message Banner & Close Button
      successBanner.style.display = 'block';
      closeCardBtn.style.display = 'inline-block';

      // 5. Start Multi-Color Gradient Wave Animation Across Entire Screen
      cowModal.classList.add('animated-bg');
    }

    /* STEP: CLOSE BUTTON CLICKED -> LETTERS EXIT SCREEN, GATHER TO CENTER, FORM CARD, AND RETURN TO PORTAL */
    function transformLettersAndReturn() {
      successBanner.style.display = 'none';
      closeCardBtn.style.display = 'none';
      cowCardWrapper.style.display = 'none';
      cowTitleBox.style.display = 'none';

      letterAnimOverlay.style.display = 'flex';
      flyingLettersBox.innerHTML = '';

      const textPhrase = "I LOVE YOU SO MUCH";
      const letters = textPhrase.split('');
      const spanElements = [];

      // 1. Create flying letters scattered around screen
      letters.forEach((char, index) => {
        const span = document.createElement('span');
        span.innerText = char === ' ' ? '\u00A0' : char;
        span.style.position = 'absolute';
        span.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
        span.style.color = colors[Math.floor(Math.random() * colors.length)];
        span.style.fontSize = '2.5rem';
        span.style.fontWeight = '800';
        span.style.textShadow = '0 0 15px rgba(255,255,255,0.8)';
        span.style.transition = 'all 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55)';

        // Initial random scattered positions outside/edges of screen
        const startX = (Math.random() - 0.5) * window.innerWidth * 1.5;
        const startY = (Math.random() - 0.5) * window.innerHeight * 1.5;
        span.style.transform = `translate(${startX}px, ${startY}px) scale(0.3) rotate(${Math.random() * 360}deg)`;
        span.style.opacity = '0';

        flyingLettersBox.appendChild(span);
        spanElements.push({ element: span, index: index });
      });

      // 2. Animate letters to center to form the phrase/card
      setTimeout(() => {
        spanElements.forEach((item, i) => {
          item.element.style.opacity = '1';
          const offsetX = (i - spanElements.length / 2) * 22;
          item.element.style.transform = `translate(${offsetX}px, 0px) scale(1.2) rotate(0deg)`;
          item.element.style.fontFamily = 'Dancing Script, cursive';
          item.element.style.color = '#ffffff';
          item.element.style.textShadow = '0 0 20px #ff007f, 0 0 40px #7a00ff';
        });
      }, 100);

      // 3. After holding in center, letters disperse/return back into their places and portal resets
      setTimeout(() => {
        spanElements.forEach((item) => {
          const endX = (Math.random() - 0.5) * window.innerWidth * 1.8;
          const endY = (Math.random() - 0.5) * window.innerHeight * 1.8;
          item.element.style.transform = `translate(${endX}px, ${endY}px) scale(0.2) rotate(${Math.random() * 360}deg)`;
          item.element.style.opacity = '0';
        });

        setTimeout(() => {
          letterAnimOverlay.style.display = 'none';
          returnToPortal();
        }, 1200);

      }, 2500);
    }

    /* RETURN TO MAIN SECURITY GATE PORTAL */
    function returnToPortal() {
      if (backgroundMezmur) {
        backgroundMezmur.pause();
        backgroundMezmur.currentTime = 0;
      }

      cowModal.classList.remove('active', 'animated-bg');
      
      // Reset modal contents for next time
      cowTitleBox.style.display = 'flex';
      cowGif.style.display = 'block';
      feelingFormBox.style.display = 'flex';
      cowCardWrapper.style.display = 'flex';
      successBanner.style.display = 'none';
      closeCardBtn.style.display = 'none';
      cowCardWrapper.classList.remove('no-wrapper');
      userFeelingInput.value = '';

      // Show security gate again
      securityGate.style.display = 'flex';
      securityGate.style.opacity = '1';
      gatePass.value = '';
    }
  </script>
